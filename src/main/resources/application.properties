spring.application.name=BlogSiteApplication

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/blogsite?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration (Optional, but commonly used with MySQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Root logging level
logging.level.root=INFO

# Enable debug logs for your service
#logging.level.com.blogsite.service=DEBUG

# Log format
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level %logger{36} - %msg%n